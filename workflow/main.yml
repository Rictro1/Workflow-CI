workflow_content = """name: MLflow CI Training

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow joblib

      - name: Check project structure
        run: |
          pwd
          ls -la
          ls -la MLProject

      - name: Run MLflow Project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Check training output
        run: |
          echo "Isi folder MLProject:"
          ls -la MLProject
          echo "Isi folder artifacts:"
          ls -la MLProject/artifacts || true
          echo "Isi folder mlruns:"
          ls -la MLProject/mlruns || true

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-trained-model-artifacts
          path: |
            MLProject/artifacts
            MLProject/mlruns
"""

with open("/Workflow-CI/workflow/main.yml", "w") as f:
    f.write(workflow_content)

print("main.yml berhasil dibuat.")
