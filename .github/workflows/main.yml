name: MLflow CI Advanced

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-build-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow joblib

      - name: Check repository structure
        run: |
          pwd
          ls -la
          ls -la MLProject

      - name: Run MLflow Project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Check training output
        run: |
          echo "Root directory:"
          ls -la
          echo "MLProject directory:"
          ls -la MLProject
          echo "Model directory:"
          ls -la MLProject/model || true
          echo "Artifacts directory:"
          ls -la MLProject/artifacts || true
          echo "MLruns directory:"
          ls -la MLProject/mlruns || true

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-training-artifacts
          path: |
            MLProject/model
            MLProject/artifacts
            MLProject/mlruns

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image with MLflow
        run: |
          mlflow models build-docker \
            -m MLProject/model \
            -n ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-model:latest

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-model:latest
